name: Deploy Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and Build Backend
        run: dotnet build backend/backend.slnx --configuration Release

      - name: Run Backend Tests
        run: dotnet test backend/backend.slnx --configuration Release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./frontend

      - name: Lint and Build Frontend
        run: pnpm run build
        working-directory: ./frontend

