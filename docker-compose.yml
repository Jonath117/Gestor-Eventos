services:
  db:
    image: postgres:17-alpine
    container_name: campeando-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-gestor_eventos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    container_name: campeando-mailpit
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    environment:
      MP_MAX_MESSAGES: 5000

  minio:
    image: minio/minio
    container_name: campeando-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-mc:
    image: minio/mc
    container_name: campeando-minio-mc
    depends_on:
      - minio
    environment:
      MINIO_USER: ${MINIO_USER:-minioadmin}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    volumes:
      - ./infra/minio-seed:/seed
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...';
      sleep 5;
      mc alias set local http://minio:9000 $${MINIO_USER} $${MINIO_PASSWORD};
      mc mb local/gestor-eventos || true;
      mc anonymous set download local/gestor-eventos;
      mc cp /seed/dummy.png local/gestor-eventos/covers/dummy.png;
      mc cp /seed/dummy.png local/gestor-eventos/receipts/dummy.png;
      mc cp /seed/dummy.png local/gestor-eventos/qr-codes/dummy.png;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
