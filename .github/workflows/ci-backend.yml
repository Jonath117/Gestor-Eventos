name: CI Backend

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'backend/**'

jobs:
  ci-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: "Paso 2: Código Limpio (Lint/Format)"
        run: dotnet format backend/backend.slnx --verify-no-changes

      - name: "Paso 3: Compilación"
        run: dotnet build backend/backend.slnx --configuration Release

      - name: "Paso 4: Ejecución de Tests"
        run: dotnet test backend/backend.slnx --no-build

      - name: "Paso 5: Docker Build Check"
        run: docker build ./backend -t backend-api:test
